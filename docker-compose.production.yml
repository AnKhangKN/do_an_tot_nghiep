services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: mydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  # API Server + Socket.io
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./server/.env.production
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: 8080
    ports:
      - "${HOST_PORT:-8080}:8080"

  # BullMQ Worker (ghép đôi ca cứu hộ)
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "src/workers/sos.worker.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./server/.env.production
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

volumes:
  postgres_data:
  redis_data:
