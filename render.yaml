services:
  # 1. Express.js RESTful API Server & Socket.io (build từ Dockerfile)
  - type: web
    name: rescue-api-server
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # MAIL — gửi mail bằng Brevo SMTP Relay (MAIL_DRIVER=brevo).
      # MAIL_FROM/MAIL_USERNAME/BREVO_API_KEY đặt giá trị ở Render Dashboard
      # (sync: false -> Render không ghi đè giá trị bạn nhập thủ công).
      - key: MAIL_DRIVER
        value: brevo
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # FIREBASE — dán toàn bộ nội dung file service-account.json (JSON 1 dòng) vào
      # Render Dashboard cho biến FIREBASE_SERVICE_ACCOUNT.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # 2. BullMQ SOS Worker (Xử lý ghép đôi ca cứu hộ chạy ngầm, cùng Dockerfile)
  - type: worker
    name: rescue-sos-worker
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    dockerCommand: node src/workers/sos.worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAIL_DRIVER
        value: brevo
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
