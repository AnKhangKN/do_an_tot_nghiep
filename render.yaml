services:
  # 1. Express.js RESTful API Server & Socket.io
  - type: web
    name: rescue-api-server
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # MAIL — gửi mail bằng Brevo SMTP Relay (MAIL_DRIVER=brevo).
      # MAIL_FROM/MAIL_USERNAME/BREVO_API_KEY đặt giá trị ở Render Dashboard
      # (sync: false -> Render không ghi đè giá trị bạn nhập thủ công).
      - key: MAIL_DRIVER
        value: brevo
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: BREVO_API_KEY
        sync: false

  # 2. BullMQ SOS Worker (Xử lý ghép đôi ca cứu hộ chạy ngầm)
  - type: worker
    name: rescue-sos-worker
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
